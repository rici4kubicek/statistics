; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = statistics, int_math, exponential_smoothing_i32, mean_accumulator_i32, window_regression_i32

[common]
lib_deps=
  symlink://../

; one environment per example program in src/<name>/, each is built and run by `pio run`
[example]
extends = common
platform = native
build_flags = -Wall -lm
extra_scripts = post:scripts/run_native.py

[env:statistics]
extends = example
build_src_filter = +<statistics/>

[env:int_math]
extends = example
build_src_filter = +<int_math/>

[env:exponential_smoothing_i32]
extends = example
build_src_filter = +<exponential_smoothing_i32/>

[env:mean_accumulator_i32]
extends = example
build_src_filter = +<mean_accumulator_i32/>

[env:window_regression_i32]
extends = example
build_src_filter = +<window_regression_i32/>

[env:native_unittest]
extends = common
platform = native
build_flags =
    -D UNIT_TEST
    -lm
lib_deps =
    ${common.lib_deps}
    throwtheswitch/Unity@^2.6.0
