# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  pre_merge_checks:
    # The built-in docstring coverage check cannot be scoped to paths and
    # counts Unity test functions, which this repo does not document.
    docstrings:
      mode: "off"
    custom_checks:
      - name: "Library docstring coverage"
        mode: "warning"
        instructions: |
          Only consider functions added or modified in this PR that are
          defined or declared in files under `include/` or `src/`.
          Ignore everything under `example/` (including `example/test/`),
          and ignore `docs/`.

          Pass if every such function has a Doxygen comment (`/** ... */`
          or `///`) directly above its declaration or definition. A public
          function counts as documented if its declaration in `include/`
          has one. Functions generated by the `STAT_SUPPORT_TYPE_*` macros
          count as documented when the macro or the type-specific function
          list in `include/statistics.h` describes them.

          Fail otherwise, and list each undocumented function with its file.
